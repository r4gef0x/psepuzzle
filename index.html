(function () {
  const html = document.documentElement;
  const RTL = new Set(["ar"]);
  const SPEICHER = "psepuzzle.sprache";

  // Aus den Wünschen des Browsers die beste vorhandene Fassung wählen.
  //
  // `navigator.languages` liefert Angaben wie "de-AT", "pt-PT" oder "zh-TW" — Sprache plus
  // Region, und die Region ist meist eine andere als unsere Ordnernamen. Deshalb in drei
  // Stufen: erst genau, dann über die Schriftvariante des Chinesischen, dann nur die Sprache.
  // Findet sich nichts, bleibt es bei Englisch — nicht bei der ersten Fassung im Objekt.
  function beste() {
    const gemerkt = localStorage.getItem(SPEICHER);
    if (gemerkt && SPRACHEN[gemerkt]) return gemerkt;

    const vorhanden = Object.keys(SPRACHEN);
    for (const wunsch of (navigator.languages || [navigator.language || "en"])) {
      const w = wunsch.toLowerCase();
      const treffer = vorhanden.find(s => s.toLowerCase() === w);
      if (treffer) return treffer;

      if (w.startsWith("zh")) {
        // Traditionell schreiben Taiwan, Hongkong und Macau; alles andere vereinfacht.
        const trad = /\b(hant|tw|hk|mo)\b/.test(w);
        const ziel = trad ? "zh-Hant" : "zh-Hans";
        if (SPRACHEN[ziel]) return ziel;
      }
      const basis = w.split("-")[0];
      const nurSprache = vorhanden.find(s => s.toLowerCase().split("-")[0] === basis);
      if (nurSprache) return nurSprache;
    }
    return "en";
  }

  function setzen(code) {
    const t = SPRACHEN[code] || SPRACHEN.en;
    html.lang = t.htmlLang || code;
    html.dir = RTL.has(code) ? "rtl" : "ltr";

    for (const el of document.querySelectorAll("[data-i18n]")) {
      const wert = t[el.dataset.i18n];
      if (wert != null) el.textContent = wert;
    }
    // Nur dort, wo eine Adresse im Satz steht — der Text kommt aus unserer eigenen Datei,
    // nicht von aussen.
    for (const el of document.querySelectorAll("[data-i18n-html]")) {
      const wert = t[el.dataset.i18nHtml];
      if (wert != null) el.innerHTML = wert;
    }

    const liste = document.getElementById("features");
    liste.innerHTML = "";
    for (const punkt of t.features) {
      const li = document.createElement("li");
      li.textContent = punkt;
      liste.appendChild(li);
    }

    document.title = t.title;
    const beschr = document.querySelector('meta[name="description"]');
    if (beschr) beschr.setAttribute("content", t.tagline);

    document.getElementById("sprache").value = code;
  }

  const wahl = document.getElementById("sprache");
  for (const [code, t] of Object.entries(SPRACHEN)) {
    const o = document.createElement("option");
    o.value = code; o.textContent = t.name;
    wahl.appendChild(o);
  }
  wahl.addEventListener("change", () => {
    localStorage.setItem(SPEICHER, wahl.value);
    setzen(wahl.value);
  });

  setzen(beste());
  html.classList.remove("wartet");
})();
</script>

(function () {
  const grund = document.querySelector(".grund");
  if (!grund) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  let angefordert = false;

  function schieben() {
    angefordert = false;
    const hoehe = window.innerHeight;
    const strecke = Math.max(1, document.documentElement.scrollHeight - hoehe);
    // Spielraum: Die Ebene ist 140 vh hoch und ragt 20 vh nach unten hinaus — genutzt werden
    // davon nur 18, damit am oberen Rand nichts aufreisst, wenn eine Rundung danebenliegt.
    const spielraum = hoehe * 0.18;
    const faktor = Math.min(0.3, spielraum / strecke);
    grund.style.transform = "translate3d(0," + (window.scrollY * faktor).toFixed(1) + "px,0)";
  }

  addEventListener("scroll", function () {
    if (!angefordert) { angefordert = true; requestAnimationFrame(schieben); }
  }, { passive: true });
  addEventListener("resize", schieben, { passive: true });
  // **Nach dem Laden noch einmal.** Der Faktor haengt an der Seitenhoehe, und die waechst, wenn
  // die Bildschirmfotos ankommen. Ohne das hier bliebe ein zu grosser Versatz stehen, bis der
  // naechste Scrollschritt ihn korrigiert.
  addEventListener("load", schieben);
  schieben();
})();
// </hintergrund>
