<!DOCTYPE html>
<html lang="en" class="wartet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTE Puzzle — Certificate</title>
<link rel="icon" href="icon.png">
<style>
  :root{
    --bg:#0f0d17; --panel:#171426; --line:#2a2540;
    --ink:#d9d5e6; --leise:#8f89a6;
    --teal:#23e6c8; --violett:#c842ff; --gold:#ffc43d;
    --akzent:var(--violett);
    --gut:#39d98a; --schlecht:#ff5f6d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:6vh 1.2rem; background:var(--bg); color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; justify-content:center;
  }
  main{width:100%; max-width:34rem}
  .kopf{display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:1.6rem}
  .marke{
    font-size:.78rem; letter-spacing:.22em; text-transform:uppercase;
    color:var(--leise);
  }
  /* Die Sprachwahl sitzt in der Kopfzeile statt fest oben rechts: Diese Seite ist eine schmale
     Karte, kein Aufmacher — ein schwebendes Feld haette darueber gehangen. */
  .sprachwahl select{
    background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:999px;
    padding:.25rem 1.6rem .25rem .7rem; font-size:.8rem;
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7'><path d='M1 1l4 4 4-4' fill='none' stroke='%238f89a6' stroke-width='1.6'/></svg>");
    background-repeat:no-repeat; background-position:right .55rem center;
  }
  html[dir="rtl"] .sprachwahl select{padding:.25rem .7rem .25rem 1.6rem; background-position:left .55rem center}
  .karte{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:1.6rem; border-top:3px solid var(--akzent);
  }
  .status{display:flex; align-items:center; gap:.7rem; font-size:1.35rem; font-weight:600}
  .status .zeichen{
    width:1.9rem; height:1.9rem; border-radius:50%; flex:0 0 auto;
    display:grid; place-items:center; font-size:1.1rem; color:#0d0b12;
  }
  .echt .zeichen{background:var(--gut)} .echt{color:var(--gut)}
  .falsch .zeichen{background:var(--schlecht)} .falsch{color:var(--schlecht)}
  .unklar .zeichen{background:var(--leise)} .unklar{color:var(--leise)}
  dl{margin:1.5rem 0 0; display:grid; grid-template-columns:auto 1fr; gap:.55rem 1.2rem}
  dt{color:var(--leise); font-size:.9rem}
  dd{margin:0; font-variant-numeric:tabular-nums}
  .stufe{color:var(--akzent); font-weight:600}
  .zahl{font-size:1.05rem}
  .fuss{margin-top:1.6rem; font-size:.82rem; line-height:1.55; color:var(--leise)}
  .fuss p{margin:.6rem 0}
  a{color:var(--akzent)}
  code{font-size:.85em; word-break:break-all; color:var(--leise)}
  html.wartet body{visibility:hidden}
</style>
</head>
<body>
<main>
  <div class="kopf">
    <div class="marke">PTE Puzzle</div>
    <div class="sprachwahl"><select id="sprache" aria-label="Language"></select></div>
  </div>
  <div class="karte">
    <div id="status" class="status unklar">
      <span class="zeichen">…</span><span id="statustext">Checking…</span>
    </div>
    <dl id="felder" hidden>
      <dt id="l-level">Level</dt><dd class="stufe" id="v-stufe">—</dd>
      <dt id="l-result">Result</dt><dd class="zahl">118 / 118</dd>
      <dt id="l-date">Date</dt><dd id="v-datum">—</dd>
      <dt id="l-no">Certificate</dt><dd id="v-nummer">—</dd>
    </dl>
    <div class="fuss" id="fuss"></div>
  </div>
  <p style="margin:1.6rem 0 0;font-size:.9rem"><a href="./" id="zurueck">PTE Puzzle →</a></p>
</main>

// Sprachwahl wie auf der Projektseite — dieselbe Reihenfolge der Versuche, damit sich beide
// Seiten gleich verhalten. Die Wahl wird geteilt: Wer auf der Startseite Japanisch gewaehlt
// hat, bekommt hier auch Japanisch.
const RTL = new Set(["ar"]);
const SPEICHER = "psepuzzle.sprache";

function besteSprache(){
  const gemerkt = localStorage.getItem(SPEICHER);
  if (gemerkt && SPRACHEN[gemerkt]) return gemerkt;
  const vorhanden = Object.keys(SPRACHEN);
  for (const wunsch of (navigator.languages || [navigator.language || "en"])) {
    const w = wunsch.toLowerCase();
    const treffer = vorhanden.find(s => s.toLowerCase() === w);
    if (treffer) return treffer;
    if (w.startsWith("zh")) {
      const ziel = /\b(hant|tw|hk|mo)\b/.test(w) ? "zh-Hant" : "zh-Hans";
      if (SPRACHEN[ziel]) return ziel;
    }
    const basis = w.split("-")[0];
    const nurSprache = vorhanden.find(s => s.toLowerCase().split("-")[0] === basis);
    if (nurSprache) return nurSprache;
  }
  return "en";
}

let SPRACHE = "en";
let T = null;

const $ = id => document.getElementById(id);
const b64u = s => {
  const t = s.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(t + "=".repeat((4 - t.length % 4) % 4));
  return Uint8Array.from(bin, c => c.charCodeAt(0));
};

function setzeStatus(art, text){
  const el = $("status");
  el.className = "status " + art;
  el.querySelector(".zeichen").textContent = art === "echt" ? "✓" : art === "falsch" ? "✕" : "?";
  $("statustext").textContent = text;
}

function beschrifte(){
  $("l-level").textContent = T.level;
  $("l-result").textContent = T.ergebnis;
  $("l-date").textContent = T.datum;
  $("l-no").textContent = T.nummer;
  $("zurueck").textContent = T.zurueck + " →";
}

function datumLesbar(iso){
  const d = new Date(iso + "T00:00:00Z");
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(T.locale,
    { year:"numeric", month:"long", day:"numeric", timeZone:"UTC" });
}

async function pruefe(){
  beschrifte();
  setzeStatus("unklar", T.pruefe);
  $("felder").hidden = true;
  $("fuss").innerHTML = "";

  // Die Nutzlast steht hinter dem '#'. Alles davor ist nur die Adresse dieser Seite.
  const roh = location.hash.replace(/^#/, "");
  const p = new URLSearchParams(roh);
  const s = p.get("s"), d = p.get("d"), n = p.get("n"), sig = p.get("sig");

  if (!s || !d || !n || !sig) {
    document.documentElement.style.setProperty("--akzent", "var(--violett)");
    setzeStatus("unklar", T.unklar);
    $("fuss").innerHTML = `<p>${T.erklaerungUnklar}</p>`;
    return;
  }

  // Genau die Felder, genau in dieser Reihenfolge — so hat die App sie unterschrieben.
  const nutzlast = `s=${s}&d=${d}&n=${n}`;

  let gueltig = false;
  try {
    const key = await crypto.subtle.importKey(
      "raw", b64u(OEFFENTLICHER_SCHLUESSEL),
      { name:"ECDSA", namedCurve:"P-256" }, false, ["verify"]);
    gueltig = await crypto.subtle.verify(
      { name:"ECDSA", hash:"SHA-256" }, key, b64u(sig),
      new TextEncoder().encode(nutzlast));
  } catch (e) {
    gueltig = false;
  }

  const farbe = { easy:"var(--teal)", normal:"var(--violett)", nerd:"var(--gold)" }[s];
  if (farbe) document.documentElement.style.setProperty("--akzent", farbe);

  $("v-stufe").textContent  = T.stufen[s] || s;
  $("v-datum").textContent  = datumLesbar(d);
  $("v-nummer").textContent = n;
  $("felder").hidden = false;

  setzeStatus(gueltig ? "echt" : "falsch", gueltig ? T.echt : T.falsch);
  $("fuss").innerHTML =
    `<p>${gueltig ? T.erklaerungEcht : T.erklaerungFalsch}</p>` +
    `<p>${T.datenschutz}</p>` +
    `<p>${T.grenze}</p>`;
}

function setzeSprache(code){
  SPRACHE = SPRACHEN[code] ? code : "en";
  T = SPRACHEN[SPRACHE];
  document.documentElement.lang = T.htmlLang;
  document.documentElement.dir = RTL.has(SPRACHE) ? "rtl" : "ltr";
  document.title = T.titel;
  $("sprache").value = SPRACHE;
  pruefe();
}

const wahl = $("sprache");
for (const [code, t] of Object.entries(SPRACHEN)) {
  const o = document.createElement("option");
  o.value = code; o.textContent = t.name;
  wahl.appendChild(o);
}
wahl.addEventListener("change", () => {
  localStorage.setItem(SPEICHER, wahl.value);
  setzeSprache(wahl.value);
});

// Eine reine Änderung hinter dem '#' laedt die Seite **nicht** neu. Ohne das hier bliebe ein
// zweiter, anderer QR-Code auf dem Ergebnis des ersten stehen — und wer im Adressfeld die
// Stufe von Hand hochsetzt, saehe weiter "echt".
window.addEventListener("hashchange", pruefe);

setzeSprache(besteSprache());
document.documentElement.classList.remove("wartet");
</script>
